name: Fix graph main typecheck
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'edmundokutuzov333'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Patch graph narrowing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/app/os/graph/GraphStudio.tsx')
          s = p.read_text()
          old = 'if (!point || node.type !== "work_object") return null;'
          new = 'if (!point || !("humanId" in node) || !("title" in node)) return null;'
          if old not in s:
              raise SystemExit('Graph narrowing pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/os/graph/GraphStudio.tsx
          git commit -m "fix: narrow graph nodes on main"
          git push origin HEAD:main
      - name: Remove temporary workflow from main
        run: |
          git pull --rebase origin main
          git rm .github/workflows/fix-graph-main.yml
          git commit -m "chore: remove temporary graph main workflow"
          git push origin HEAD:main
