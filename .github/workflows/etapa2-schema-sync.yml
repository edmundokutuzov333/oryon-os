name: etapa2-schema-sync
on:
  push:
    branches:
      - feat/etapa2-core-integrity-graph-permissions-eventing
permissions:
  contents: write
jobs:
  sync:
    if: github.actor == 'edmundokutuzov333'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch canonical schema and repositories
        shell: python
        run: |
          from pathlib import Path
          import re

          def model_block(text: str, model: str):
              match = re.search(rf'(^model {re.escape(model)} \{{.*?^\}}\n)', text, re.MULTILINE | re.DOTALL)
              if not match:
                  raise SystemExit(f'Model not found: {model}')
              return match.start(), match.end(), match.group(1)

          def patch_model(path: str, model: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              start, end, block = model_block(text, model)
              if block.count(old) != 1:
                  raise SystemExit(f'{model}: expected one match, found {block.count(old)}: {old[:120]!r}')
              patched = block.replace(old, new, 1)
              p.write_text(text[:start] + patched + text[end:])

          schema_path = 'packages/db/prisma/schema.prisma'
          patch_model(schema_path, 'Organization', '  webhookDeliveries   WebhookDelivery[]\n', '  webhookDeliveries   WebhookDelivery[]\n  workspaceMembers    WorkspaceMember[]\n  consumerDeliveries  OutboxConsumerDelivery[]\n')
          patch_model(schema_path, 'Workspace', '  org Organization @relation(fields: [orgId], references: [id], onDelete: Cascade)\n', '  org               Organization    @relation(fields: [orgId], references: [id], onDelete: Cascade)\n  workspaceMembers  WorkspaceMember[]\n')
          patch_model(schema_path, 'User', '  notifications       Notification[]\n', '  notifications       Notification[]\n  workspaceMembers    WorkspaceMember[]\n')
          patch_model(schema_path, 'Agent', '  runs        AgentRun[]\n', '  runs        AgentRun[]\n  idempotency AgentRunIdempotency[]\n')
          patch_model(schema_path, 'AgentRun', '  agent                Agent            @relation(fields: [agentId], references: [id], onDelete: Cascade)\n', '  agent                Agent            @relation(fields: [agentId], references: [id], onDelete: Cascade)\n  idempotency           AgentRunIdempotency[]\n')
          patch_model(schema_path, 'Edge', '  @@unique([fromType, fromId, toType, toId, relation])\n', '  @@index([orgId, fromType, fromId, toType, toId, relation])\n')
          patch_model(schema_path, 'DomainEvent', '  webhookDeliveries WebhookDelivery[]\n', '  webhookDeliveries WebhookDelivery[]\n  consumerDeliveries OutboxConsumerDelivery[]\n\n  dispatchStatus    String    @default("PENDING") @map("dispatch_status")\n  dispatchAttempts  Int       @default(0) @map("dispatch_attempts")\n  dispatchLockedAt  DateTime? @map("dispatch_locked_at")\n  dispatchLastError String?   @map("dispatch_last_error")\n  dispatchedAt      DateTime? @map("dispatched_at")\n')

          marker = 'model WebhookDelivery {'
          addition = '''model WorkspaceMember {\n  id          String   @id @default(cuid(2))\n  orgId       String   @map("org_id")\n  workspaceId String   @map("workspace_id")\n  userId      String   @map("user_id")\n  role        String   @default("MEMBER")\n  joinedAt    DateTime @default(now()) @map("joined_at")\n\n  org        Organization @relation(fields: [orgId], references: [id], onDelete: Cascade)\n  workspace  Workspace    @relation(fields: [workspaceId], references: [id], onDelete: Cascade)\n  user       User         @relation(fields: [userId], references: [id], onDelete: Cascade)\n\n  @@unique([workspaceId, userId])\n  @@index([orgId, userId])\n  @@index([orgId, workspaceId])\n  @@map("workspace_members")\n}\n\nmodel OutboxConsumerDelivery {\n  id           String      @id @default(cuid(2))\n  orgId        String      @map("org_id")\n  eventId      String      @map("event_id")\n  consumerKey  String      @map("consumer_key")\n  status       String      @default("PROCESSING")\n  attempts     Int         @default(1)\n  lockedAt     DateTime?   @map("locked_at")\n  lastError    String?     @map("last_error")\n  deliveredAt  DateTime?   @map("delivered_at")\n  createdAt    DateTime    @default(now()) @map("created_at")\n\n  org   Organization @relation(fields: [orgId], references: [id], onDelete: Cascade)\n  event DomainEvent  @relation(fields: [eventId], references: [id], onDelete: Cascade)\n\n  @@unique([orgId, eventId, consumerKey])\n  @@index([orgId, consumerKey, createdAt])\n  @@map("outbox_consumer_deliveries")\n}\n\nmodel AgentRunIdempotency {\n  org            Organization @relation(fields: [orgId], references: [id], onDelete: Cascade)\n  orgId          String       @map("org_id")\n  agent          Agent        @relation(fields: [agentId], references: [id], onDelete: Cascade)\n  agentId        String       @map("agent_id")\n  run            AgentRun     @relation(fields: [runId], references: [id], onDelete: Cascade)\n  runId          String       @map("run_id")\n  idempotencyKey String       @map("idempotency_key")\n  createdAt      DateTime     @default(now()) @map("created_at")\n\n  @@id([orgId, agentId, idempotencyKey])\n  @@index([orgId, runId])\n  @@map("agent_run_idempotency")\n}\n\n'''
          schema = Path(schema_path)
          text = schema.read_text()
          if 'model WorkspaceMember {' not in text:
              if marker not in text:
                  raise SystemExit('WebhookDelivery marker not found')
              schema.write_text(text.replace(marker, addition + marker, 1))

          migration_path = Path('packages/db/prisma/migrations/20260917150000_etapa2_integrity/migration.sql')
          migration = migration_path.read_text()
          if 'edges_fromType_fromId_toType_toId_relation_key' not in migration:
              migration = migration.replace(
                  'CREATE UNIQUE INDEX IF NOT EXISTS "edges_active_unique"',
                  'DROP INDEX IF EXISTS "edges_fromType_fromId_toType_toId_relation_key";\n\nCREATE UNIQUE INDEX IF NOT EXISTS "edges_active_unique"',
                  1,
              )
          if 'count(*) FROM "workspaces" w2' not in migration:
              migration = migration.replace(
                  'WHERE w."deleted_at" IS NULL\nON CONFLICT ("workspace_id", "user_id") DO NOTHING;',
                  'WHERE w."deleted_at" IS NULL\n  AND (SELECT count(*) FROM "workspaces" w2 WHERE w2."org_id" = w."org_id" AND w2."deleted_at" IS NULL) = 1\nON CONFLICT ("workspace_id", "user_id") DO NOTHING;',
                  1,
              )
          if '"outbox_consumer_deliveries"' in migration and '"status" text NOT NULL DEFAULT' not in migration:
              migration = migration.replace(
                  '  "consumer_key" text NOT NULL,\n',
                  '  "consumer_key" text NOT NULL,\n  "status" text NOT NULL DEFAULT \'PROCESSING\',\n  "attempts" integer NOT NULL DEFAULT 1,\n  "locked_at" timestamp(3),\n  "last_error" text,\n  "delivered_at" timestamp(3),\n',
                  1,
              )
          migration_path.write_text(migration)

          graph_path = Path('packages/db/src/repositories/graph.repository.ts')
          graph = graph_path.read_text()
          if 'async findById(orgId: string, id: string)' not in graph:
              anchor = 'export class GraphRepository {\n\tprivate readonly db: PrismaClient;\n\n'
              if anchor not in graph:
                  raise SystemExit('GraphRepository anchor not found')
              graph = graph.replace(
                  anchor,
                  anchor + '''\tasync findById(orgId: string, id: string) {\n\t\treturn withOrgContext(this.db, orgId, (tx) =>\n\t\t\ttx.edge.findFirst({ where: { id, orgId } }),\n\t\t);\n\t}\n\n''',
                  1,
              )
          graph = graph.replace(' AND (deleted_at IS NULL OR deleted_at IS NULL)', '')
          graph_path.write_text(graph)

          agent_path = Path('packages/db/src/repositories/agent.repository.ts')
          agent = agent_path.read_text()
          if 'agent_run_idempotency' not in agent:
              old = '''\t\t\tif (!agent) throw new Error("NOT_FOUND");\n\t\t\tconst id = randomUUID();\n'''
              new = '''\t\t\tif (!agent) throw new Error("NOT_FOUND");\n\t\t\tconst idempotencyKey = input.idempotencyKey ?? requestId;\n\t\t\tif (idempotencyKey) {\n\t\t\t\tawait tx.$executeRaw`SELECT pg_advisory_xact_lock(hashtextextended(${`${orgId}:${agentId}:${idempotencyKey}`}, 0))`;\n\t\t\t\tconst existing = await tx.$queryRaw<Array<{ run_id: string }>>`\n\t\t\t\t\tSELECT run_id FROM agent_run_idempotency\n\t\t\t\t\tWHERE org_id = ${orgId} AND agent_id = ${agentId} AND idempotency_key = ${idempotencyKey}\n\t\t\t\t\tLIMIT 1\n\t\t\t\t`;\n\t\t\t\tif (existing[0]) return { id: existing[0].run_id };\n\t\t\t}\n\t\t\tconst id = randomUUID();\n'''
              if agent.count(old) != 1:
                  raise SystemExit('Agent createRun anchor not found')
              agent = agent.replace(old, new, 1)
              event_anchor = '''\t\t\t});\n\t\t\tawait appendDomainEvent(tx, {\n\t\t\t\torgId,\n\t\t\t\tactorId,\n\t\t\t\tactorType: "MEMBER",\n\t\t\t\tsubjectType: "AgentRun",\n'''
              event_replacement = '''\t\t\t});\n\t\t\tif (idempotencyKey) {\n\t\t\t\tawait tx.$executeRaw`\n\t\t\t\t\tINSERT INTO agent_run_idempotency (org_id, agent_id, idempotency_key, run_id)\n\t\t\t\t\tVALUES (${orgId}, ${agentId}, ${idempotencyKey}, ${id})\n\t\t\t\t`;\n\t\t\t}\n\t\t\tawait appendDomainEvent(tx, {\n\t\t\t\torgId,\n\t\t\t\tactorId,\n\t\t\t\tactorType: "MEMBER",\n\t\t\t\tsubjectType: "AgentRun",\n'''
              if agent.count(event_anchor) != 1:
                  raise SystemExit('Agent event anchor not found')
              agent = agent.replace(event_anchor, event_replacement, 1)
              agent_path.write_text(agent)

          Path('.github/workflows/etapa2-schema-sync.yml').unlink()
          print('Schema synchronization patch prepared.')

      - name: Validate generated Prisma client and schema
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm db:validate

      - name: Commit synchronized state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/prisma/schema.prisma packages/db/prisma/migrations/20260917150000_etapa2_integrity/migration.sql packages/db/src/repositories/graph.repository.ts packages/db/src/repositories/agent.repository.ts .github/workflows/etapa2-schema-sync.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(etapa2): synchronize persistence schema and execution idempotency"
          git push origin HEAD:feat/etapa2-core-integrity-graph-permissions-eventing
