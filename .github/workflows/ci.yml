name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: oryon-main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-lockfile:
    name: synchronize lockfile
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Synchronize lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): synchronize pnpm lockfile [skip ci]"
          git push origin HEAD:main

  verify:
    name: verify
    needs: sync-lockfile
    if: always() && (needs.sync-lockfile.result == 'success' || needs.sync-lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Sync latest main after lockfile repair
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git fetch origin main && git reset --hard origin/main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - run: node scripts/check-boundaries.mjs
      - run: node scripts/check-v1-invariants.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --passWithNoTests
      - run: pnpm build

  infra-and-db:
    name: infrastructure and database
    needs: sync-lockfile
    if: always() && (needs.sync-lockfile.result == 'success' || needs.sync-lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_USER: oryon
      POSTGRES_PASSWORD: oryon_local
      POSTGRES_DB: oryon
      DATABASE_URL: postgresql://oryon:oryon_local@127.0.0.1:5432/oryon
      DATABASE_DIRECT_URL: postgresql://oryon:oryon_local@127.0.0.1:5432/oryon
      REDIS_URL: redis://127.0.0.1:6379
      ORYON_AUTH_JWT_SECRET: ci-phase3-identity-secret-0123456789abcdef
      ORYON_AUTH_SESSION_TTL_SECONDS: 2592000
      ORYON_AUTH_ACCESS_TTL_SECONDS: 900
      ORYON_AUTH_MAGIC_LINK_TTL_SECONDS: 600
      ORYON_AUTH_DEV_MODE: true
      ORYON_AUTH_COOKIE_NAME: oryon_session
      ORYON_API_URL: http://127.0.0.1:4000
      ORYON_WEB_URL: http://127.0.0.1:3000
      S3_BUCKET: oryon-local
      MINIO_ROOT_USER: oryon
      MINIO_ROOT_PASSWORD: oryon_local_password
      TYPESENSE_API_KEY: oryon-typesense-local
    steps:
      - uses: actions/checkout@v5
      - name: Sync latest main after lockfile repair
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git fetch origin main && git reset --hard origin/main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Validate Prisma schema
        run: pnpm db:validate
      - name: Validate Compose configuration
        run: pnpm infra:config
      - name: Start local infrastructure
        run: pnpm infra:up
      - name: Diagnose local infrastructure
        run: pnpm infra:doctor
      - name: Apply database migrations
        run: pnpm db:migrate:deploy
      - name: Check migration status after deploy
        run: pnpm db:migrate:status
      - name: Run deterministic database seed
        run: pnpm db:seed
      - name: Run deterministic database seed again
        run: pnpm db:seed
      - name: Verify RLS tenant isolation
        run: pnpm db:rls:verify
      - name: Start API for phase 3 smoke test
        run: |
          pnpm --filter @oryon/api exec tsx src/server.ts >/tmp/oryon-api.log 2>&1 &
          echo $! >/tmp/oryon-api.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/oryon-api.log
          exit 1
      - name: Exercise magic link and authenticated session
        run: |
          response=$(curl --fail --silent --request POST http://127.0.0.1:4000/v1/auth/request-link \
            --header 'Content-Type: application/json' \
            --header 'X-Oryon-Org: org_demo_0001' \
            --header 'Idempotency-Key: ci-request-link-1' \
            --data '{"email":"admin@oryon.local"}')
          token=$(printf '%s' "$response" | jq -r '.data.debugToken')
          test -n "$token"
          verify=$(curl --fail --silent --request POST http://127.0.0.1:4000/v1/auth/verify-link \
            --header 'Content-Type: application/json' \
            --header 'X-Oryon-Org: org_demo_0001' \
            --header 'Idempotency-Key: ci-verify-link-1' \
            --cookie-jar /tmp/oryon-cookies.txt \
            --data "{\"token\":\"$token\"}")
          access=$(printf '%s' "$verify" | jq -r '.data.accessToken')
          test -n "$access"
          printf '%s' "$access" >/tmp/oryon-access.txt
          printf '%s' "$verify" | jq -e '.data.accessToken and .data.expiresAt' >/dev/null
          curl --fail --silent http://127.0.0.1:4000/v1/auth/session \
            --header 'X-Oryon-Org: org_demo_0001' \
            --cookie /tmp/oryon-cookies.txt \
            | jq -e '.data.user.email == "admin@oryon.local" and .data.organization.id == "org_demo_0001" and (.data.workspaces | length) >= 1 and (.data.teams | length) >= 1' >/dev/null
      - name: Exercise work object engine
        run: |
          access=$(cat /tmp/oryon-access.txt)
          type_key="vehicle"
          curl --fail --silent --request POST http://127.0.0.1:4000/v1/object-types \
            --header "Authorization: Bearer $access" \
            --header 'Content-Type: application/json' \
            --header 'X-Oryon-Org: org_demo_0001' \
            --header 'Idempotency-Key: ci-object-type-1' \
            --data '{"key":"vehicle","name":"Viatura","pluralName":"Viaturas","idPrefix":"VTR","schema":{"fields":[{"key":"plate","label":"Matrícula","type":"TEXT","required":true}]},"statusModel":{"initial":"available","states":[{"key":"available","label":"Disponível","category":"TODO","order":0},{"key":"maintenance","label":"Manutenção","category":"IN_PROGRESS","order":1},{"key":"retired","label":"Retirada","category":"CANCELLED","order":2}],"transitions":[{"from":"available","to":"maintenance"},{"from":"maintenance","to":"available"},{"from":"maintenance","to":"retired"}]}}' \
            | jq -e '.data.id' >/tmp/oryon-vehicle-type.txt
          object=$(curl --fail --silent --request POST http://127.0.0.1:4000/v1/work-objects \
            --header "Authorization: Bearer $access" \
            --header 'Content-Type: application/json' \
            --header 'X-Oryon-Org: org_demo_0001' \
            --header 'Idempotency-Key: ci-work-object-1' \
            --data '{"typeKey":"vehicle","workspaceId":"ws_demo_0001","title":"Viatura CI","priority":"HIGH","customFields":{"plate":"MZ-01-AA"}}')
          object_id=$(printf '%s' "$object" | jq -r '.data.id')
          test -n "$object_id"
          printf '%s' "$object" | jq -e '.data.humanId and .data.permissions.read == true and .data.permissions.update == true and .data.customFields.plate == "MZ-01-AA" and (.data.placements | length) >= 1' >/dev/null
          curl --fail --silent http://127.0.0.1:4000/v1/work-objects/$object_id \
            --header "Authorization: Bearer $access" \
            --header 'X-Oryon-Org: org_demo_0001' \
            | jq -e '.data.id == "'"$object_id"'" and .data.customFields.plate == "MZ-01-AA"' >/dev/null
          curl --fail --silent --request POST http://127.0.0.1:4000/v1/work-objects/$object_id/status \
            --header "Authorization: Bearer $access" \
            --header 'Content-Type: application/json' \
            --header 'X-Oryon-Org: org_demo_0001' \
            --header 'Idempotency-Key: ci-work-status-1' \
            --data '{"status":"maintenance","comment":"CI transition"}' \
            | jq -e '.data.status == "maintenance" and .data.statusCategory == "IN_PROGRESS"' >/dev/null
          curl --fail --silent --request PATCH http://127.0.0.1:4000/v1/work-objects/$object_id \
            --header "Authorization: Bearer $access" \
            --header 'Content-Type: application/json' \
            --header 'X-Oryon-Org: org_demo_0001' \
            --header 'Idempotency-Key: ci-work-patch-1' \
            --data '{"customFields":{"plate":"MZ-02-BB"}}' \
            | jq -e '.data.customFields.plate == "MZ-02-BB" and .data.permissions.update == true' >/dev/null
          list=$(curl --fail --silent "http://127.0.0.1:4000/v1/work-objects?workspaceId=ws_demo_0001&typeKey=$type_key" \
            --header "Authorization: Bearer $access" \
            --header 'X-Oryon-Org: org_demo_0001')
          printf '%s' "$list" | jq -e '.data | map(select(.id == "'"$object_id"'")) | length == 1' >/dev/null
      - name: Exercise cross-organization session rejection
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4000/v1/auth/session \
            --header 'X-Oryon-Org: org_demo_0002' \
            --cookie /tmp/oryon-cookies.txt)
          test "$status" = "401"
      - name: Stop API
        if: always()
        run: |
          if test -f /tmp/oryon-api.pid; then kill "$(cat /tmp/oryon-api.pid)" || true; fi
      - name: Show service status
        if: always()
        run: pnpm infra:status
      - name: Show service logs
        if: failure()
        run: |
          docker compose -f infra/docker/docker-compose.yml logs --no-color
          cat /tmp/oryon-api.log 2>/dev/null || true
      - name: Stop local infrastructure
        if: always()
        run: pnpm infra:down