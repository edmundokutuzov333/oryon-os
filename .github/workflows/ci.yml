name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: node scripts/check-boundaries.mjs
      - run: node scripts/check-v1-invariants.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --passWithNoTests
      - run: pnpm build
