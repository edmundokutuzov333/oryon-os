name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies and materialize lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Persist generated lockfile
        if: github.ref == 'refs/heads/main' && !cancelled()
        run: |
          if [ -f pnpm-lock.yaml ] && git status --porcelain pnpm-lock.yaml | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(deps): materialize pnpm lockfile [skip ci]"
            git push origin HEAD:main
          fi
      - run: node scripts/check-boundaries.mjs
      - run: node scripts/check-v1-invariants.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --passWithNoTests
      - run: pnpm build
