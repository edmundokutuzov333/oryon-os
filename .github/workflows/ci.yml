name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: oryon-main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-lockfile:
    name: synchronize lockfile
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Synchronize lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): synchronize pnpm lockfile [skip ci]"
          git push origin HEAD:main

  verify:
    name: verify
    needs: sync-lockfile
    if: always() && (needs.sync-lockfile.result == 'success' || needs.sync-lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Sync latest main after lockfile repair
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git fetch origin main && git reset --hard origin/main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - run: node scripts/check-boundaries.mjs
      - run: node scripts/check-v1-invariants.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --passWithNoTests
      - run: pnpm build

  infra-and-db:
    name: infrastructure and database
    needs: sync-lockfile
    if: always() && (needs.sync-lockfile.result == 'success' || needs.sync-lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_USER: oryon
      POSTGRES_PASSWORD: oryon_local
      POSTGRES_DB: oryon
      DATABASE_URL: postgresql://oryon:oryon_local@127.0.0.1:5432/oryon
      DATABASE_DIRECT_URL: postgresql://oryon:oryon_local@127.0.0.1:5432/oryon
      S3_BUCKET: oryon-local
      MINIO_ROOT_USER: oryon
      MINIO_ROOT_PASSWORD: oryon_local_password
      TYPESENSE_API_KEY: oryon-typesense-local
    steps:
      - uses: actions/checkout@v5
      - name: Sync latest main after lockfile repair
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git fetch origin main && git reset --hard origin/main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Validate Prisma schema
        run: pnpm db:validate
      - name: Validate Compose configuration
        run: pnpm infra:config
      - name: Start local infrastructure
        run: pnpm infra:up
      - name: Diagnose local infrastructure
        run: pnpm infra:doctor
      - name: Check migration status before deploy
        run: pnpm db:migrate:status
      - name: Apply database migrations
        run: pnpm db:migrate:deploy
      - name: Run deterministic database seed
        run: pnpm db:seed
      - name: Run deterministic database seed again
        run: pnpm db:seed
      - name: Verify RLS tenant isolation
        run: pnpm db:rls:verify
      - name: Show service status
        if: always()
        run: pnpm infra:status
      - name: Show service logs
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs --no-color
      - name: Stop local infrastructure
        if: always()
        run: pnpm infra:down
