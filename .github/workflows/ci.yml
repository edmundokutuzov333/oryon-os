name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - run: node scripts/check-boundaries.mjs
      - run: node scripts/check-v1-invariants.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --passWithNoTests
      - run: pnpm build

  infra-and-db:
    name: infrastructure and database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_USER: oryon
      POSTGRES_PASSWORD: oryon_local
      POSTGRES_DB: oryon
      DATABASE_URL: postgresql://oryon:oryon_local@127.0.0.1:5432/oryon
      DATABASE_DIRECT_URL: postgresql://oryon:oryon_local@127.0.0.1:5432/oryon
      S3_BUCKET: oryon-local
      MINIO_ROOT_USER: oryon
      MINIO_ROOT_PASSWORD: oryon_local_password
      TYPESENSE_API_KEY: oryon-typesense-local
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Validate Prisma schema
        run: pnpm db:validate
      - name: Validate Compose configuration
        run: pnpm infra:config
      - name: Start local infrastructure
        run: pnpm infra:up
      - name: Diagnose local infrastructure
        run: pnpm infra:doctor
      - name: Check migration status before deploy
        run: pnpm db:migrate:status
      - name: Apply database migrations
        run: pnpm db:migrate:deploy
      - name: Run deterministic database seed
        run: pnpm db:seed
      - name: Run deterministic database seed again
        run: pnpm db:seed
      - name: Verify RLS tenant isolation
        run: pnpm db:rls:verify
      - name: Show service status
        if: always()
        run: pnpm infra:status
      - name: Show service logs
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs --no-color
      - name: Stop local infrastructure
        if: always()
        run: pnpm infra:down
