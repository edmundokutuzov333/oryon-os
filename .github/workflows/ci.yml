name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies and synchronize lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit synchronized lockfile
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): synchronize pnpm lockfile [skip ci]"
          git push origin HEAD:main
      - run: node scripts/check-boundaries.mjs
      - run: node scripts/check-v1-invariants.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --passWithNoTests
      - run: pnpm build

  infra:
    name: local infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies and synchronize lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Validate Compose configuration
        run: pnpm infra:config
      - name: Start local infrastructure
        run: pnpm infra:up
      - name: Diagnose local infrastructure
        run: pnpm infra:doctor
      - name: Show service status
        if: always()
        run: pnpm infra:status
      - name: Show service logs
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs --no-color
      - name: Stop local infrastructure
        if: always()
        run: pnpm infra:down
