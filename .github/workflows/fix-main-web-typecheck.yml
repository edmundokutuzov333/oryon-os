name: Fix main web typecheck

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Patch Web TypeScript errors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changed = False

          def edit(path, replacements):
              global changed
              p = Path(path)
              text = p.read_text()
              new = text
              for old, replacement in replacements:
                  if old not in new:
                      continue
                  new = new.replace(old, replacement)
              if new != text:
                  p.write_text(new)
                  changed = True

          edit('apps/web/src/app/os/agents/AgentsStudio.tsx', [
              ('"neutral" | "info" | "positive" | "negative"', '"neutral" | "info" | "positive" | "danger"'),
              ('return "negative";', 'return "danger";'),
          ])

          edit('apps/web/src/app/os/automations/AutomationsStudio.tsx', [
              ('"neutral" | "info" | "positive" | "negative"', '"neutral" | "info" | "positive" | "danger"'),
              ('return "negative";', 'return "danger";'),
              ('if (!response.ok) return; setRuns((current) => ({ ...current, [run.workflowId]: WorkflowRunResponseSchema.parse(payloadData(await response.json())) }));', 'if (!response.ok) return; const next = WorkflowRunResponseSchema.parse(payloadData(await response.json())); setRuns((current) => ({ ...current, [run.workflowId]: next }));'),
          ])

          edit('apps/web/src/app/os/communication/CommunicationStudio.tsx', [
              ('useRef<Socket>();', 'useRef<Socket | undefined>(undefined);'),
              ('useRef<string>();', 'useRef<string | undefined>(undefined);'),
              ('<Avatar initials={initials(message.author.displayName ?? message.author.name)} aria-label={message.author.displayName ?? message.author.name} />', '<Avatar name={message.author.displayName ?? message.author.name} aria-label={message.author.displayName ?? message.author.name} />'),
              ('body: reacted ? undefined : JSON.stringify({ emoji })', '...(reacted ? {} : { body: JSON.stringify({ emoji }) })'),
          ])

          edit('apps/web/src/app/os/docs/DocsStudio.tsx', [
              ('const documentRef = useRef<Y.Doc>();', 'const documentRef = useRef<Y.Doc | null>(null);'),
              ('  if (!documentRef.current) { documentRef.current = new Y.Doc(); if (initialUpdate) Y.applyUpdate(documentRef.current, initialUpdate); }', '  if (!documentRef.current) { const document = new Y.Doc(); if (initialUpdate) Y.applyUpdate(document, initialUpdate); documentRef.current = document; }'),
              ('const saveTimer = useRef<ReturnType<typeof setTimeout>>();', 'const saveTimer = useRef<ReturnType<typeof setTimeout> | undefined>(undefined);'),
              ('Collaboration.configure({ document: documentRef.current })', 'Collaboration.configure({ document: documentRef.current as Y.Doc })'),
          ])

          edit('apps/web/src/app/os/graph/GraphStudio.tsx', [
              ('if (!point) return null;\n\t\t\t\t\t\t\tconst active = node.id === rootId;', 'if (!point || node.type !== "work_object") return null;\n\t\t\t\t\t\t\tconst active = node.id === rootId;'),
          ])

          edit('apps/web/src/app/os/meetings/MeetingsStudio.tsx', [
              ('const enabled = await room.localParticipant.setMicrophoneEnabled(!mic); setMic(enabled);', 'const publication = await room.localParticipant.setMicrophoneEnabled(!mic); setMic(Boolean(publication));'),
              ('const enabled = await room.localParticipant.setCameraEnabled(!camera); setCamera(enabled);', 'const publication = await room.localParticipant.setCameraEnabled(!camera); setCamera(Boolean(publication));'),
              ('const enabled = await room.localParticipant.setScreenShareEnabled(!screen); setScreen(enabled);', 'const publication = await room.localParticipant.setScreenShareEnabled(!screen); setScreen(Boolean(publication));'),
              ('<StatusChip label={`${participants.length} ${COPY.participants.toLocaleLowerCase("pt-PT")}`} tone="neutral" />', '<StatusChip state="neutral">{`${participants.length} ${COPY.participants.toLocaleLowerCase("pt-PT")}`}</StatusChip>'),
              ('<StatusChip label={statusLabel(meeting.state)} tone={meeting.state === "LIVE" ? "success" : meeting.state === "CANCELLED" ? "danger" : "neutral"} />', '<StatusChip state={meeting.state === "LIVE" ? "positive" : meeting.state === "CANCELLED" ? "danger" : "neutral"}>{statusLabel(meeting.state)}</StatusChip>'),
              ('days[index].toISOString()', 'days[index]!.toISOString()'),
          ])

          edit('apps/web/src/app/os/templates/DomainTemplatesStudio.tsx', [
              ('<PageHeader eyebrow={COPY.eyebrow} title={COPY.title} description={COPY.description} />', '<PageHeader title={COPY.title} description={COPY.description} />'),
          ])

          edit('apps/web/src/app/os/work/WorkObjectStudio.tsx', [
              ('const states = statusLines.split("\\n").map((line, order) => line.trim()).filter(Boolean).map((line) => {\n\t\t\t\tconst [key, label] = line.split("|").map((value) => value.trim());\n\t\t\t\treturn { key, label: label || key, category: statusCategory(key), order };\n\t\t\t});', 'const states = statusLines.split("\\n").map((line, order) => ({ line: line.trim(), order })).filter((item) => Boolean(item.line)).map(({ line, order }) => {\n\t\t\t\tconst [keyPart, labelPart] = line.split("|").map((value) => value.trim());\n\t\t\t\tconst key = keyPart ?? "";\n\t\t\t\tconst label = labelPart ?? "";\n\t\t\t\treturn { key, label: label || key, category: statusCategory(key), order };\n\t\t\t});'),
              ('Array.isArray(customFields[field.key]) ? customFields[field.key].join(", ") : ""', 'Array.isArray(customFields[field.key]) ? (customFields[field.key] as unknown[]).map(String).join(", ") : ""'),
          ])

          if not changed:
              raise SystemExit('No changes required')
          PY
      - name: Commit fixes directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/os/agents/AgentsStudio.tsx apps/web/src/app/os/automations/AutomationsStudio.tsx apps/web/src/app/os/communication/CommunicationStudio.tsx apps/web/src/app/os/docs/DocsStudio.tsx apps/web/src/app/os/graph/GraphStudio.tsx apps/web/src/app/os/meetings/MeetingsStudio.tsx apps/web/src/app/os/templates/DomainTemplatesStudio.tsx apps/web/src/app/os/work/WorkObjectStudio.tsx
          git commit -m "fix: repair consolidated web type errors on main"
          git push origin HEAD:main
      - name: Remove patch workflow from main
        run: |
          git pull --rebase origin main
          git rm .github/workflows/fix-main-web-typecheck.yml
          git commit -m "chore: remove temporary main typecheck patch workflow"
          git push origin HEAD:main
