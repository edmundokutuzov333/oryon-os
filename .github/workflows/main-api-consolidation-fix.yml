name: Main API consolidation fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'edmundokutuzov333'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Patch consolidated API integrations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Missing {label} in {path}")
              p.write_text(s.replace(old, new, 1))

          replace_once('apps/api/src/search-ai.ts', 'can(snapshot, resource,', 'can({ orgId, ...snapshot }, resource,', 'search AI read can')
          replace_once('apps/api/src/search-ai.ts', 'const sources = [];', 'const sources: Array<{ id: string; title: string; text: string }> = [];', 'search AI sources type')

          p = Path('apps/api/src/graph.ts')
          s = p.read_text()
          s = s.replace('import { GraphRepository, PermissionRepository } from "@oryon/db/repositories";', 'import { GraphRepository, PermissionRepository, WorkObjectRepository } from "@oryon/db/repositories";', 1)
          s = s.replace('const graph = new GraphRepository(getPrisma());\nconst permissions', 'const graph = new GraphRepository(getPrisma());\nconst workObjects = new WorkObjectRepository(getPrisma());\nconst permissions', 1)
          s = s.replace('function objectResource(object: { orgId: string; id: string; workspaceId: string | null; ownerId: string | null; classification: string | null }) {\n\treturn { orgId: object.orgId, type: "work_object", id: object.id, workspaceId: object.workspaceId, projectId: null, ownerId: object.ownerId, teamId: null, classification: object.classification };\n}', 'function objectResource(orgId: string, object: { id: string; workspaceId: string | null; ownerId: string | null; classification?: string | null }) {\n\treturn { orgId, type: "work_object", id: object.id, workspaceId: object.workspaceId, projectId: null, ownerId: object.ownerId, teamId: null, classification: object.classification ?? null };\n}', 1)
          s = s.replace('const object = await graph.getWorkObject(orgId, objectId);', 'const object = await workObjects.findById(orgId, objectId);', 1)
          s = s.replace('can({ orgId, ...snapshot }, objectResource(object), "read")', 'can({ orgId, ...snapshot }, objectResource(orgId, object), "read")')
          s = s.replace('can({ orgId, ...snapshot }, objectResource(object), "update")', 'can({ orgId, ...snapshot }, objectResource(orgId, object), "update")')
          p.write_text(s)

          p = Path('apps/api/src/meetings-v2.ts')
          s = p.read_text()
          pattern = r'const token = await (new AccessToken\(.*?\))\.addGrant\((\{.*?\})\)\.toJwt\(\);'
          new = r'const accessToken = \1; accessToken.addGrant(\2); const token = await accessToken.toJwt();'
          updated, count = re.subn(pattern, new, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('LiveKit AccessToken chain not found')
          p.write_text(updated)
          PY
      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/search-ai.ts apps/api/src/graph.ts apps/api/src/meetings-v2.ts
          git commit -m "fix: complete consolidated API integrations on main"
          git push origin HEAD:main
      - name: Remove temporary workflow
        run: |
          git pull --rebase origin main
          git rm .github/workflows/main-api-consolidation-fix.yml
          git commit -m "chore: remove temporary main API integration workflow"
          git push origin HEAD:main
