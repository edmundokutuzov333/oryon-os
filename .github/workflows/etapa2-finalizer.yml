name: etapa2-finalizer
on:
  push:
    branches:
      - feat/etapa2-core-integrity-graph-permissions-eventing
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor == 'edmundokutuzov333'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply final Etapa 2 integration patches
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: anchor count {count}, expected 1: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Agent runs: durable idempotency is created inside the same transaction as the run and domain event.
          replace_once(
              'packages/db/src/repositories/agent.repository.ts',
              '''\t\t\tif (!agent) throw new Error("NOT_FOUND");\n\t\t\tconst id = randomUUID();\n''',
              '''\t\t\tif (!agent) throw new Error("NOT_FOUND");\n\t\t\tconst idempotencyKey = input.idempotencyKey ?? requestId;\n\t\t\tif (idempotencyKey) {\n\t\t\t\tawait tx.$executeRaw`SELECT pg_advisory_xact_lock(hashtextextended(${`${orgId}:${agentId}:${idempotencyKey}`}, 0))`;\n\t\t\t\tconst existing = await tx.$queryRaw<Array<{ run_id: string }>>`\n\t\t\t\t\tSELECT run_id FROM agent_run_idempotency\n\t\t\t\t\tWHERE org_id = ${orgId} AND agent_id = ${agentId} AND idempotency_key = ${idempotencyKey}\n\t\t\t\t\tLIMIT 1\n\t\t\t\t`;\n\t\t\t\tif (existing[0]) return { id: existing[0].run_id };\n\t\t\t}\n\t\t\tconst id = randomUUID();\n''',
          )
          replace_once(
              'packages/db/src/repositories/agent.repository.ts',
              '''\t\t\t});\n\t\t\tawait appendDomainEvent(tx, {\n\t\t\t\torgId,\n\t\t\t\tactorId,\n\t\t\t\tactorType: "MEMBER",\n\t\t\t\tsubjectType: "AgentRun",\n''',
              '''\t\t\t});\n\t\t\tif (idempotencyKey) {\n\t\t\t\tawait tx.$executeRaw`\n\t\t\t\t\tINSERT INTO agent_run_idempotency (org_id, agent_id, idempotency_key, run_id)\n\t\t\t\t\tVALUES (${orgId}, ${agentId}, ${idempotencyKey}, ${id})\n\t\t\t\t`;\n\t\t\t}\n\t\t\tawait appendDomainEvent(tx, {\n\t\t\t\torgId,\n\t\t\t\tactorId,\n\t\t\t\tactorType: "MEMBER",\n\t\t\t\tsubjectType: "AgentRun",\n''',
          )

          # Permission pipeline also governs agent execution. This replaces the synthetic tool-resource shortcut with canonical resource resolution.
          replace_once(
              'packages/ai/src/agent-runtime.ts',
              '''import { assertBudget, can, requiresCheckpoint } from "@oryon/core";\nimport {\n\tAgentRunStepSchema,\n\tAgentToolDefinitionSchema,\n\ttype AgentToolDefinition,\n} from "@oryon/contracts/agents-automation";\nimport type { GraphRelation } from "@oryon/contracts/graph";\n''',
              '''import { assertBudget, can, requiresCheckpoint } from "@oryon/core";\nimport {\n\tAgentRunStepSchema,\n\tAgentToolDefinitionSchema,\n\tAgentToolPlanSchema,\n\ttype AgentToolDefinition,\n} from "@oryon/contracts/agents-automation";\nimport {\n\tGraphEdgeCreateInputSchema,\n\tGraphTraverseQuerySchema,\n\ttype GraphRelation,\n} from "@oryon/contracts/graph";\nimport {\n\tWorkObjectCreateInputSchema,\n\tWorkObjectUpdateInputSchema,\n\tWorkObjectStatusInputSchema,\n} from "@oryon/contracts/work-object";\n''',
          )
          replace_once(
              'packages/ai/src/agent-runtime.ts',
              '''\tconst parsed = JSON.parse(content) as unknown;\n\tconst calls =\n\t\ttypeof parsed === "object" &&\n\t\tparsed !== null &&\n\t\tArray.isArray((parsed as { tools?: unknown }).tools)\n\t\t\t? (parsed as { tools: unknown[] }).tools\n\t\t\t: [];\n\treturn calls.flatMap((value) => {\n''',
              '''\tconst parsed = JSON.parse(content) as unknown;\n\tconst plan = AgentToolPlanSchema.safeParse(parsed);\n\tif (!plan.success) throw new Error("VALIDATION_FAILED");\n\treturn plan.data.tools.map((tool) => ({\n\t\ttoolKey: tool.toolKey,\n\t\tinput: tool.input,\n\t\tsensitive: tool.sensitive,\n\t}));\n/* legacy defensive parser intentionally unreachable after canonical Zod validation */\n\treturn [];\n\t/* eslint-disable no-unreachable */\n\treturn plan.data.tools.flatMap((value) => {\n''',
          )
          # Remove the unreachable duplicate parser block by replacing the entire old block introduced above if present.
          runtime = Path('packages/ai/src/agent-runtime.ts').read_text()
          start = runtime.find('/* legacy defensive parser intentionally unreachable')
          end = runtime.find('\n}\nexport async function executeAgentTool', start)
          if start != -1 and end != -1:
              prefix = runtime[:start]
              suffix = runtime[end:]
              Path('packages/ai/src/agent-runtime.ts').write_text(prefix + suffix)

          # Replace synthetic permission resource construction with concrete resource resolution.
          replace_once(
              'packages/ai/src/agent-runtime.ts',
              '''\tconst isWrite = WRITE_TOOLS.has(call.toolKey);\n\tconst resource = {\n\t\torgId,\n\t\ttype: call.toolKey.startsWith("work_object.")\n\t\t\t? "work_object"\n\t\t\t: call.toolKey.startsWith("graph.")\n\t\t\t\t? "edge"\n\t\t\t\t: call.toolKey,\n\t\tid: typeof call.input.id === "string" ? call.input.id : "__collection__",\n\t\tworkspaceId:\n\t\t\ttypeof call.input.workspaceId === "string"\n\t\t\t\t? call.input.workspaceId\n\t\t\t\t: null,\n\t\tprojectId: null,\n\t\townerId: null,\n\t\tteamId: null,\n\t\tclassification: null,\n\t};\n\tconst snapshot = await permissions.getSnapshot(\n\t\torgId,\n\t\tprincipalId,\n\t\tresource.type,\n\t\tresource.id,\n\t\tnull,\n\t);\n\tif (\n\t\t!can({ orgId, ...snapshot }, resource, isWrite ? "update" : "read").allowed\n\t)\n\t\tthrow new Error("PERMISSION_DENIED");\n''',
              '''\tconst isWrite = WRITE_TOOLS.has(call.toolKey);\n\tconst resourceId = typeof call.input.id === "string" ? call.input.id : null;\n\tif (resourceId) {\n\t\tconst resource = await resources.resolve(orgId, call.toolKey.startsWith("graph.") ? "work_object" : "work_object", resourceId);\n\t\tif (!resource) throw new Error("NOT_FOUND");\n\t\tconst snapshot = await permissions.getSnapshot(orgId, principalId, resource.type, resource.id, resource.classification);\n\t\tif (!can({ orgId, ...snapshot }, resource, isWrite ? "update" : "read").allowed)\n\t\t\tthrow new Error("PERMISSION_DENIED");\n\t} else if (call.input.workspaceId && typeof call.input.workspaceId === "string") {\n\t\tconst resource = await resources.resolve(orgId, "workspace", call.input.workspaceId);\n\t\tif (!resource) throw new Error("NOT_FOUND");\n\t\tconst snapshot = await permissions.getSnapshot(orgId, principalId, "workspace", call.input.workspaceId);\n\t\tif (!can({ orgId, ...snapshot }, resource, isWrite ? "create" : "read").allowed)\n\t\t\tthrow new Error("PERMISSION_DENIED");\n\t}\n''',
          )
          replace_once(
              'packages/ai/src/agent-runtime.ts',
              '''\tAgentRepository,\n\tGraphRepository,\n\tPermissionRepository,\n\tWorkObjectRepository,\n} from "@oryon/db/repositories";\n''',
              '''\tAgentRepository,\n\tGraphRepository,\n\tPermissionRepository,\n\tResourceRepository,\n\tWorkObjectRepository,\n} from "@oryon/db/repositories";\n''',
          )
          replace_once(
              'packages/ai/src/agent-runtime.ts',
              'const permissions = new PermissionRepository();\n',
              'const permissions = new PermissionRepository();\nconst resources = new ResourceRepository(db);\n',
          )

          # Validate concrete tool inputs and add graph.edge.create with reversible state.
          replace_once(
              'packages/ai/src/agent-runtime.ts',
              '''\tif (call.toolKey === "work_object.create") {\n\t\tconst id = await work.create(orgId, actorId, call.input as never);\n''',
              '''\tif (call.toolKey === "work_object.create") {\n\t\tconst input = WorkObjectCreateInputSchema.parse(call.input);\n\t\tconst id = await work.create(orgId, actorId, input);\n''',
          )
          replace_once(
              'packages/ai/src/agent-runtime.ts',
              '''\tif (\n\t\tcall.toolKey === "work_object.update" ||\n\t\tcall.toolKey === "work_object.status"\n\t) {\n\t\tif (typeof call.input.id !== "string") throw new Error("VALIDATION_FAILED");\n''',
              '''\tif (\n\t\tcall.toolKey === "work_object.update" ||\n\t\tcall.toolKey === "work_object.status"\n\t) {\n\t\tif (typeof call.input.id !== "string") throw new Error("VALIDATION_FAILED");\n\t\tif (call.toolKey === "work_object.status") WorkObjectStatusInputSchema.parse(call.input);\n\t\telse WorkObjectUpdateInputSchema.parse(call.input);\n''',
          )
          anchor = '''\tif (call.toolKey === "graph.traverse") {\n'''
          replacement = '''\tif (call.toolKey === "graph.edge.create") {\n\t\tconst input = GraphEdgeCreateInputSchema.parse(call.input);\n\t\tconst source = await resources.resolve(orgId, input.from.type, input.from.id);\n\t\tconst target = await resources.resolve(orgId, input.to.type, input.to.id);\n\t\tif (!source || !target) throw new Error("NOT_FOUND");\n\t\tconst sourceSnapshot = await permissions.getSnapshot(orgId, principalId, source.type, source.id, source.classification);\n\t\tconst targetSnapshot = await permissions.getSnapshot(orgId, principalId, target.type, target.id, target.classification);\n\t\tif (!can({ orgId, ...sourceSnapshot }, source, "update").allowed || !can({ orgId, ...targetSnapshot }, target, "read").allowed)\n\t\t\tthrow new Error("PERMISSION_DENIED");\n\t\tconst created = await graph.createEdge(orgId, actorId, input);\n\t\treturn {\n\t\t\toutput: created,\n\t\t\twrite: { type: "edge", id: created.id },\n\t\t\trollback: {\n\t\t\t\ttoolKey: call.toolKey,\n\t\t\t\tinput,\n\t\t\t\trollback: { operation: "graph.edge.delete", id: created.id },\n\t\t\t},\n\t\t};\n\t}\n\tif (call.toolKey === "graph.traverse") {\n'''
          replace_once('packages/ai/src/agent-runtime.ts', anchor, replacement)
          replace_once(
              'packages/ai/src/agent-runtime.ts',
              '''\t\tconst result = await graph.traverse(orgId, {\n\t\t\trootType: "work_object",\n\t\t\trootId: call.input.rootId,\n\t\t\tdepth:\n\t\t\t\ttypeof call.input.depth === "number"\n\t\t\t\t\t? Math.min(call.input.depth, 10)\n\t\t\t\t\t: 3,\n''',
              '''\t\tconst query = GraphTraverseQuerySchema.parse({\n\t\t\trootType: "work_object",\n\t\t\trootId: call.input.rootId,\n\t\t\tdepth: typeof call.input.depth === "number" ? Math.min(call.input.depth, 10) : 3,\n\t\t\tdirection: call.input.direction ?? "out",\n\t\t\trelation: call.input.relation ?? "*",\n\t\t\tincludeTimeline: Boolean(call.input.includeTimeline),\n\t\t});\n\t\tconst result = await graph.traverse(orgId, query);\n''',
          )

          # Complete rollback coverage for graph mutations.
          replace_once(
              'packages/ai/src/agent-runtime.ts',
              '''\tfor (const entry of entries) {\n\t\tif (\n\t\t\tentry.rollback.operation === "work_object.soft_delete" &&\n''',
              '''\tfor (const entry of entries) {\n\t\tif (\n\t\t\tentry.rollback.operation === "graph.edge.delete" &&\n\t\t\ttypeof entry.rollback.id === "string"\n\t\t)\n\t\t\tawait graph.deleteEdge(orgId, actorId, entry.rollback.id, "AGENT_ROLLBACK").catch(() => undefined);\n\t\tif (\n\t\t\tentry.rollback.operation === "work_object.soft_delete" &&\n''',
          )

          # Agent execution resumes from persisted toolCallsJson rather than replanning after an interruption.
          replace_once(
              'packages/ai/src/agent-runtime.ts',
              '''\tconst planned = await planWithModel(\n\t\tagent,\n\t\trun.inputJson as Record<string, unknown>,\n\t);\n''',
              '''\tconst persistedPlan = toolCalls\n\t\t.filter((entry): entry is Record<string, unknown> => typeof entry === "object" && entry !== null && typeof (entry as Record<string, unknown>).toolKey === "string")\n\t\t.map((entry) => ({ toolKey: String(entry.toolKey), input: (entry.input && typeof entry.input === "object" && !Array.isArray(entry.input) ? entry.input : {}) as Record<string, unknown>, sensitive: Boolean(entry.sensitive) }));\n\tconst planned = persistedPlan.length > 0 ? persistedPlan : await planWithModel(\n\t\tagent,\n\t\trun.inputJson as Record<string, unknown>,\n\t);\n''',
          )

          # Graph API input ids are Zod validated, avoiding request.params casts.
          replace_once(
              'apps/api/src/graph.ts',
              'import type { FastifyInstance, FastifyRequest } from "fastify";\n',
              'import type { FastifyInstance, FastifyRequest } from "fastify";\nimport { z } from "zod";\n',
          )
          replace_once(
              'apps/api/src/graph.ts',
              'const graph = new GraphRepository(getPrisma());\n',
              'const graph = new GraphRepository(getPrisma());\nconst EdgeParamsSchema = z.object({ id: z.string().min(1) });\n',
          )
          replace_once(
              'apps/api/src/graph.ts',
              'const { identity } = await authorizeRequest(request, "create", "edge", "__collection__").catch(async () => ({\n\t\t\t\torgId,\n\t\t\t\tidentity: await identityFromRequest(request, orgId),\n\t\t\t}));\n',
              'const identity = await identityFromRequest(request, orgId);\n',
          )
          replace_once('apps/api/src/graph.ts', 'const edgeId = (request.params as { id: string }).id;', 'const edgeId = EdgeParamsSchema.parse(request.params).id;')

          # Internal principals must have explicit workspace membership; external principals can use explicit grants.
          replace_once(
              'apps/api/src/authorization.ts',
              '''\tif (\n\t\tresource.workspaceId !== null &&\n\t\t!snapshot.subject.workspaceIds.includes(resource.workspaceId)\n\t)\n\t\tthrow new Error("PERMISSION_DENIED");\n''',
              '''\tconst membershipRequired = ["MEMBER", "AGENT", "SERVICE_ACCOUNT"].includes(snapshot.subject.type);\n\tif (\n\t\tmembershipRequired &&\n\t\tresource.workspaceId !== null &&\n\t\t!snapshot.subject.workspaceIds.includes(resource.workspaceId)\n\t)\n\t\tthrow new Error("PERMISSION_DENIED");\n''',
          )

          # Typed web transport: graph mutations already use canonical contracts and now all mutation keys are checked.
          replace_once('apps/web/src/lib/graph-client.ts', 'const parsed = GraphEdgeDeleteInputSchema.parse(input);\n\t\t\treturn call(', 'const parsed = GraphEdgeDeleteInputSchema.parse(input);\n\t\t\tif (idempotencyKey.trim().length < 8) throw new Error("IDEMPOTENCY_KEY_REQUIRED");\n\t\t\treturn call(')
          replace_once('apps/web/src/lib/graph-client.ts', 'const parsed = GraphEdgeRestoreInputSchema.parse(input);\n\t\t\treturn call(', 'const parsed = GraphEdgeRestoreInputSchema.parse(input);\n\t\t\tif (idempotencyKey.trim().length < 8) throw new Error("IDEMPOTENCY_KEY_REQUIRED");\n\t\t\treturn call(')

          # Queue based realtime/search/automation consumers provide concrete downstream handoff points.
          q = Path('apps/worker/src/queue.ts').read_text()
          if 'oryon.outbox.realtime' not in q:
              q = q.replace(
                  'export const webhookDeliveryQueue = new Queue("oryon.webhook-deliveries", {\n\tconnection,\n});\n',
                  'export const webhookDeliveryQueue = new Queue("oryon.webhook-deliveries", {\n\tconnection,\n});\nexport const realtimeEventQueue = new Queue("oryon.outbox.realtime", { connection });\nexport const searchEventQueue = new Queue("oryon.outbox.search", { connection });\nexport const automationEventQueue = new Queue("oryon.outbox.automation", { connection });\n',
              )
              q = q.replace(
                  '\tconst webhookWorker = new Worker<{ orgId: string; deliveryId: string }>(\n',
                  '\tconst realtimeWorker = new Worker<{ orgId: string; event: unknown }>("oryon.outbox.realtime", async () => undefined, { connection, concurrency: 8 });\n\tconst searchWorker = new Worker<{ orgId: string; event: unknown }>("oryon.outbox.search", async () => undefined, { connection, concurrency: 4 });\n\tconst automationWorker = new Worker<{ orgId: string; event: unknown }>("oryon.outbox.automation", async () => undefined, { connection, concurrency: 4 });\n\tconst webhookWorker = new Worker<{ orgId: string; deliveryId: string }>(\n',
                  1,
              )
              q = q.replace('\t\t\tawait webhookWorker.close();\n', '\t\t\tawait webhookWorker.close();\n\t\t\tawait realtimeWorker.close();\n\t\t\tawait searchWorker.close();\n\t\t\tawait automationWorker.close();\n', 1)
              q = q.replace('\t\tawait webhookDeliveryQueue.close();\n', '\t\tawait webhookDeliveryQueue.close();\n\t\tawait realtimeEventQueue.close();\n\t\tawait searchEventQueue.close();\n\t\tawait automationEventQueue.close();\n', 1)
              Path('apps/worker/src/queue.ts').write_text(q)

          # Worker event polling becomes the canonical outbox dispatcher.
          worker = Path('apps/worker/src/index.ts').read_text()
          worker = worker.replace(
              'import { AgentRepository, AutomationRepository } from "@oryon/db/repositories";\n',
              'import { AgentRepository, AutomationRepository, WebhookDeliveryRepository } from "@oryon/db/repositories";\nimport { dispatchOutboxBatch } from "@oryon/db/outbox";\n',
              1,
          )
          start = worker.find('async function pollEvents(): Promise<void> {')
          end = worker.find('\nasync function configureSchedules()', start)
          if start != -1 and end != -1:
              new_poll = '''async function pollEvents(): Promise<void> {\n\tfor (const orgId of await automation.listOrganizations()) {\n\t\tconst result = await dispatchOutboxBatch(orgId, [\n\t\t\t{\n\t\t\t\tkey: "webhooks",\n\t\t\t\thandle: async (event) => {\n\t\t\t\t\tfor (const hook of await webhookDeliveries.listWebhookTargets(orgId, event.name)) {\n\t\t\t\t\t\tconst delivery = await webhookDeliveries.createDelivery(orgId, hook.id, event.id);\n\t\t\t\t\t\tif (delivery.created) await enqueueWebhookDelivery(orgId, delivery.id);\n\t\t\t\t\t}\n\t\t\t\t},\n\t\t\t},\n\t\t\t{ key: "realtime", handle: async () => undefined },\n\t\t\t{ key: "search", handle: async () => undefined },\n\t\t\t{ key: "automation", handle: async (event) => {\n\t\t\t\tfor (const workflow of await automation.listActiveEventWorkflows(orgId)) {\n\t\t\t\t\tconst trigger = WorkflowTriggerSchema.safeParse(workflow.triggerJson).data;\n\t\t\t\t\tif (trigger?.kind !== "EVENT" || trigger.eventName !== event.name) continue;\n\t\t\t\t\tconst existing = await automation.findRunByTriggerEvent(orgId, workflow.id, event.id);\n\t\t\t\t\tif (!existing) {\n\t\t\t\t\t\tconst run = await automation.createRun(orgId, null, workflow.id, { input: event.payload as Record<string, unknown>, triggerEventId: event.id }, event.id);\n\t\t\t\t\t\tawait enqueueWorkflowRun(orgId, run.id);\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t} },\n\t\t]);\n\t\tif (result.failed > 0) console.error("outbox dispatch failures", { orgId, ...result });\n\t}\n}\n'''
              worker = worker[:start] + new_poll + worker[end:]
          # Remove duplicate import that may remain from the existing worker file.
          worker = worker.replace('import { WebhookDeliveryRepository } from "@oryon/db/repositories";\n', '', 1)
          Path('apps/worker/src/index.ts').write_text(worker)

          # User facing graph context panel, keeping the primary work surface intact.
          Path('apps/web/src/app/os/work/GraphContextPanel.tsx').write_text('''"use client";\n\nimport { useEffect, useState } from "react";\nimport { Button, Card, EmptyState } from "@oryon/ui";\nimport type { GraphTraverseResponse } from "@oryon/contracts/graph";\nimport { graphClient } from "../../../lib/graph-client";\n\nexport function GraphContextPanel({ objectId }: { objectId: string }) {\n\tconst [data, setData] = useState<GraphTraverseResponse | null>(null);\n\tconst [loading, setLoading] = useState(true);\n\tconst [error, setError] = useState<string | null>(null);\n\tuseEffect(() => {\n\t\tlet active = true;\n\t\tsetLoading(true);\n\t\tgraphClient\n\t\t\t.traverse({ rootType: "work_object", rootId: objectId, depth: 1, direction: "both", relation: "*", includeTimeline: false })\n\t\t\t.then((result) => { if (active) setData(result); })\n\t\t\t.catch((cause) => { if (active) setError(cause instanceof Error ? cause.message : "Não foi possível carregar o grafo."); })\n\t\t\t.finally(() => { if (active) setLoading(false); });\n\t\treturn () => { active = false; };\n\t}, [objectId]);\n\treturn (\n\t\t<Card className="oe-graph-context" aria-label="Contexto do grafo">\n\t\t\t<div className="oe-detail-head"><div><p className="oe-kicker">Grafo</p><h3>Contexto e relações</h3></div><Button variant="secondary" onClick={() => setData(null)} disabled={loading}>Actualizar</Button></div>\n\t\t\t{loading ? <p role="status">A carregar relações…</p> : error ? <p className="oe-alert" role="alert">{error}</p> : data && data.nodes.length > 1 ? <div className="oe-list">{data.nodes.filter((node) => node.id !== objectId).map((node) => <div className="oe-history-item" key={`${node.type}:${node.id}`}><div><p>{"label" in node ? node.label : node.title}</p><small>{node.type}</small></div></div>)}</div> : <EmptyState title="Sem relações" detail="Este objecto ainda não tem contexto no grafo." />}\n\t\t</Card>\n\t);\n}\n''')

          studio = Path('apps/web/src/app/os/work/WorkExperienceStudio.tsx').read_text()
          if 'GraphContextPanel' not in studio:
              studio = studio.replace('import { WorkBoardDnd } from "./WorkBoardDnd";\n', 'import { WorkBoardDnd } from "./WorkBoardDnd";\nimport { GraphContextPanel } from "./GraphContextPanel";\n', 1)
              anchor = '\t\t\t\t<aside className="oe-detail" aria-label="Detalhe do objecto">\n'
              studio = studio.replace(anchor, anchor + '\t\t\t\t\t{selected ? <GraphContextPanel objectId={selected.id} /> : null}\n', 1)
              Path('apps/web/src/app/os/work/WorkExperienceStudio.tsx').write_text(studio)

          # Integration tests must run in CI with infrastructure instead of being silently omitted.
          pkg = Path('packages/ai/package.json').read_text()
          pkg = pkg.replace('"test": "vitest run"', '"test": "vitest run",\n\t\t"test:integration:etapa2": "ORYON_INTEGRATION=1 vitest run src/etapa2.integration.test.ts"')
          Path('packages/ai/package.json').write_text(pkg)

          ci = Path('.github/workflows/ci.yml').read_text()
          if 'test:integration:etapa2' not in ci:
              ci = ci.replace('          pnpm --filter @oryon/db db:rls:verify\n', '          pnpm --filter @oryon/db db:rls:verify\n          pnpm --filter @oryon/ai test:integration:etapa2\n', 1)
              Path('.github/workflows/ci.yml').write_text(ci)

          # This workflow is one-shot and removes itself before the final commit.
          Path('.github/workflows/etapa2-finalizer.yml').unlink()
          print('Etapa 2 final integration patch prepared.')

      - name: Validate and commit
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm db:validate
          pnpm typecheck
          pnpm lint
