name: audit-finalize-main
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor == 'edmundokutuzov333'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic audit fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          
          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing pattern in {path}: {old[:160]!r}')
              p.write_text(text.replace(old, new, 1))
          
          # OpenAPI must resolve relative to the API package, regardless of cwd.
          p = Path('apps/api/src/openapi.ts')
          s = p.read_text()
          s = s.replace('import { mkdirSync, writeFileSync } from "node:fs";\n', 'import { mkdirSync, writeFileSync } from "node:fs";\nimport { dirname, resolve } from "node:path";\nimport { fileURLToPath } from "node:url";\n', 1)
          old = 'if (process.argv[1]?.endsWith("openapi.ts")) { mkdirSync("apps/api/generated", { recursive: true }); writeFileSync("apps/api/generated/openapi.json", `${JSON.stringify(openApiDocument, null, 2)}\\n`); console.log("OpenAPI 3.1 generated at apps/api/generated/openapi.json"); }'
          new = 'if (process.argv[1]?.endsWith("openapi.ts")) { const generatedDir = resolve(dirname(fileURLToPath(import.meta.url)), "../generated"); mkdirSync(generatedDir, { recursive: true }); const outputPath = resolve(generatedDir, "openapi.json"); writeFileSync(outputPath, `${JSON.stringify(openApiDocument, null, 2)}\\n`); console.log(`OpenAPI 3.1 generated at ${outputPath}`); }'
          if old not in s:
              raise SystemExit('OpenAPI generator block not found')
          p.write_text(s.replace(old, new, 1))
          
          # Turbo must know the environment used by the release E2E script.
          p = Path('turbo.json')
          data = json.loads(p.read_text())
          data['globalPassThroughEnv'] = sorted(set(data.get('globalPassThroughEnv', [])) | {'S3_BUCKET', 'ORYON_E2E_BASE_URL', 'ORYON_E2E_ORG', 'ORYON_E2E_API_KEY'})
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          
          # Stronger visual regression contract: audit every first-party CSS surface.
          Path('scripts/test-visual.mjs').write_text('''import { readFileSync, readdirSync } from "node:fs";\nimport { join } from "node:path";\n\nconst roots = ["packages/ui/src", "apps/web/src"];\nconst cssFiles = [];\nfunction walk(dir) {\n  for (const entry of readdirSync(dir, { withFileTypes: true })) {\n    if (entry.name === "node_modules" || entry.name === ".next" || entry.name === ".turbo") continue;\n    const path = join(dir, entry.name);\n    if (entry.isDirectory()) walk(path);\n    else if (entry.isFile() && path.endsWith(".css")) cssFiles.push(path);\n  }\n}\nfor (const root of roots) walk(root);\n\nconst errors = [];\nfor (const file of cssFiles) {\n  const css = readFileSync(file, "utf8");\n  if (/linear-gradient\\s*\\(|radial-gradient\\s*\\(|conic-gradient\\s*\\(/i.test(css)) errors.push(`${file}: gradient detected`);\n  for (const match of css.matchAll(/box-shadow\\s*:\\s*([^;}]+)/gi)) {\n    const value = match[1].trim();\n    if (value !== "none" && !/\\binset\\b/i.test(value)) errors.push(`${file}: projected box-shadow detected`);\n  }\n  if (/text-shadow\\s*:\\s*(?!none)/i.test(css)) errors.push(`${file}: text-shadow detected`);\n  if (!file.endsWith("packages/ui/src/tokens/tokens.css") && /#C3F53C/i.test(css)) errors.push(`${file}: hardcoded acid accent detected outside token layer`);\n}\n\nconst tokens = readFileSync("packages/ui/src/tokens/tokens.css", "utf8");\nconst components = readFileSync("packages/ui/src/components.css", "utf8");\nif (!tokens.includes("--color-acid-500:#C3F53C")) errors.push("tokens.css: canonical acid token missing");\nif (!tokens.includes("font-variant-numeric:tabular-nums")) errors.push("tokens.css: tabular numerals missing");\nif (!components.includes("border-radius:var(--radius-full)")) errors.push("components.css: pill chrome radius missing");\nif (!components.includes("background:var(--bg-inverted)")) errors.push("components.css: inverted white panel missing");\nif (!components.includes("var(--font-mono)")) errors.push("components.css: metric mono typography missing");\n\nif (errors.length) {\n  console.error(errors.join("\\n"));\n  process.exit(1);\n}\nconsole.log(`Visual regression contract: OK (${cssFiles.length} first-party CSS files audited)`);\n''')
          
          # Replace projected shadows and decorative gradients across first-party CSS while retaining inset depth.
          for root in [Path('packages/ui/src'), Path('apps/web/src')]:
              for css_path in root.rglob('*.css'):
                  text = css_path.read_text()
                  text = re.sub(r'box-shadow\\s*:\\s*([^;}]+)', lambda m: m.group(0) if ('inset' in m.group(1).lower() or m.group(1).strip() == 'none') else 'box-shadow:none', text, flags=re.I)
                  text = re.sub(r'text-shadow\\s*:\\s*([^;}]+)', 'text-shadow:none', text, flags=re.I)
                  text = re.sub(r'(background(?:-image)?\\s*:\\s*)linear-gradient\\([^;]+\\)', r'\\1var(--bg-surface-hover)', text, flags=re.I)
                  text = re.sub(r'(background(?:-image)?\\s*:\\s*)radial-gradient\\([^;]+\\)', r'\\1var(--bg-surface-hover)', text, flags=re.I)
                  text = re.sub(r'(background(?:-image)?\\s*:\\s*)conic-gradient\\([^;]+\\)', r'\\1var(--bg-surface-hover)', text, flags=re.I)
                  css_path.write_text(text)
          
          # Projection tokens are kept as compatibility names but are no-ops.
          p = Path('packages/ui/src/tokens/tokens.css')
          s = p.read_text()
          s = re.sub(r'--shadow-inverted:[^;]+;', '--shadow-inverted:none;', s)
          s = re.sub(r'--shadow-overlay:[^;]+;', '--shadow-overlay:none;', s)
          s = re.sub(r'--shadow-chrome:[^;]+;', '--shadow-chrome:none;', s)
          p.write_text(s)
          
          # Add explicit layer boundaries to key overlay/inverted surfaces after shadow removal.
          p = Path('packages/ui/src/components.css')
          s = p.read_text()
          s = s.replace('background:var(--bg-surface);box-shadow:none;overflow:hidden', 'background:var(--bg-surface);border:1px solid var(--border-default);box-shadow:none;overflow:hidden', 1)
          s = s.replace('background:var(--bg-inverted);box-shadow:none}', 'background:var(--bg-inverted);border:1px solid var(--border-default);box-shadow:none}', 1)
          p.write_text(s)
          PY
      - name: Normalize formatting
        run: |
          pnpm exec biome format --write package.json biome.json turbo.json \
            apps/api/package.json apps/api/src/openapi.ts \
            apps/web/package.json apps/web/tsconfig.json \
            apps/worker/package.json \
            packages/contracts/package.json \
            packages/db/package.json \
            packages/storage/package.json packages/storage/tsconfig.json \
            packages/ui/package.json packages/ui/tsconfig.json \
            sdk/package.json sdk/src/index.ts \
            scripts/test-e2e.mjs scripts/test-visual.mjs \
            packages/ui/src/tokens/tokens.css packages/ui/src/components.css
      - name: Validate
        run: |
          pnpm db:generate
          pnpm check:boundaries
          pnpm check:v1
          pnpm check:phase14
          pnpm check:phase15
          pnpm gen:openapi
          pnpm gen:sdk
          pnpm typecheck
          pnpm lint
          pnpm test -- --passWithNoTests
          pnpm build
          pnpm test:e2e
          pnpm test:visual
          pnpm analyze:bundle
          pnpm performance:gate
          pnpm audit:security
          git diff --check
      - name: Commit fixes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close architectural audit release blockers"
          git push origin HEAD:main
      - name: Remove one-shot workflow
        run: |
          git pull --rebase origin main
          git rm .github/workflows/audit-finalize-main.yml
          git commit -m "chore: remove one-shot audit finalizer"
          git push origin HEAD:main
