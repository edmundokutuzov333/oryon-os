name: etapa1-schema-normalize

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Normalize ChannelMember tenant relation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          schema_path = Path('packages/db/prisma/schema.prisma')
          text = schema_path.read_text()
          old = '''  channel        Channel       @relation(fields: [channelId], references: [id], onDelete: Cascade)\n  user           User          @relation(fields: [userId], references: [id], onDelete: Cascade)\n  organization   Organization? @relation(fields: [organizationId], references: [id])\n  organizationId String?\n'''
          new = '''  organization Organization @relation(fields: [orgId], references: [id], onDelete: Cascade)\n  channel      Channel      @relation(fields: [channelId], references: [id], onDelete: Cascade)\n  user         User         @relation(fields: [userId], references: [id], onDelete: Cascade)\n'''
          if old in text:
              schema_path.write_text(text.replace(old, new, 1))
          elif 'organizationId String?' in text or 'organization   Organization?' in text:
              raise SystemExit('Unsupported ChannelMember schema state')
          PY
      - name: Add migration
        run: |
          mkdir -p packages/db/prisma/migrations/20260917143000_channel_member_tenant_key
          cat > packages/db/prisma/migrations/20260917143000_channel_member_tenant_key/migration.sql <<'SQL'
          ALTER TABLE "channel_members"
            DROP CONSTRAINT IF EXISTS "channel_members_organizationId_fkey";
          ALTER TABLE "channel_members"
            DROP COLUMN IF EXISTS "organizationId";
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname = 'channel_members_org_id_fkey'
            ) THEN
              ALTER TABLE "channel_members"
                ADD CONSTRAINT "channel_members_org_id_fkey"
                FOREIGN KEY ("org_id") REFERENCES "organizations"("id")
                ON DELETE CASCADE ON UPDATE CASCADE;
            END IF;
          END $$;
          SQL
      - name: Commit normalization
        run: |
          git add packages/db/prisma/schema.prisma packages/db/prisma/migrations/20260917143000_channel_member_tenant_key/migration.sql
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "db: canonicalize channel member tenant key"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
