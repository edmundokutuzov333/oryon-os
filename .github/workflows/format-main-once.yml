name: format-main-once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.actor == 'edmundokutuzov333'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and autofix
        run: |
          pnpm exec biome format --write .
          pnpm exec biome check --write .
      - name: Fix deterministic lint exceptions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/ui/src/tokens/tokens.css')
          s = p.read_text().replace(' !important', '')
          p.write_text(s)
          p = Path('apps/api/src/agents.ts')
          s = p.read_text().replace('request: FastifyRequest,\n\torgId:', '_request: FastifyRequest,\n\torgId:', 1)
          p.write_text(s)
          p = Path('apps/api/src/communication-v2.ts')
          s = p.read_text().replace('const current = await user(request, organizationId);', 'await user(request, organizationId);', 1)
          p.write_text(s)
          p = Path('scripts/check-boundaries.mjs')
          s = p.read_text().replace("`(?:from|import\\()\\s*[\\\"']${forbidden.replaceAll(\"/\", \"\\/\")}\\b`", "`(?:from|import\\()\\s*['\\\"]${forbidden.replaceAll(\"/\", \"\\/\")}\\b`", 1)
          p.write_text(s)
          p = Path('scripts/analyze-bundle.mjs')
          s = p.read_text().replace('const max = Number(process.env.ORYON_MAX_CHUNK_GZIP_BYTES ?? "184320");', 'const max = Number(process.env.ORYON_MAX_CHUNK_GZIP_BYTES ?? "184320");', 1)
          p.write_text(s)
          PY
          pnpm exec biome format --write .
          pnpm exec biome check --write .
      - name: Validate
        run: |
          pnpm db:generate
          pnpm check:boundaries
          pnpm check:v1
          pnpm check:phase13
          pnpm check:phase14
          pnpm check:phase15
          pnpm gen:openapi
          pnpm gen:sdk
          pnpm typecheck
          pnpm lint
          git diff --check
      - name: Commit formatted source to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: normalize source and close lint blockers"
          git push origin HEAD:main
