name: format-main-once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.actor == 'edmundokutuzov333'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome format --write .
      - run: git diff --check
      - name: Validate
        run: |
          pnpm db:generate
          pnpm check:boundaries
          pnpm check:v1
          pnpm check:phase14
          pnpm check:phase15
          pnpm gen:openapi
          pnpm gen:sdk
          pnpm typecheck
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: normalize source formatting"
          git push origin HEAD:main
      - name: Remove one-shot workflow
        run: |
          git pull --rebase origin main
          git rm .github/workflows/format-main-once.yml
          git commit -m "chore: remove one-shot source formatter"
          git push origin HEAD:main
