name: phase1-normalize

on:
  push:
    branches: [exec/phase1-canonical-build-integrity]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor == 'edmundokutuzov333'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://oryon:oryon_local@localhost:5432/oryon?schema=public
      DATABASE_DIRECT_URL: postgresql://oryon:oryon_local@localhost:5432/oryon?schema=public
      ORYON_AUTH_JWT_SECRET: ci-only-secret-with-at-least-32-characters
      ORYON_AUTH_DEV_MODE: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: exec/phase1-canonical-build-integrity
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Remove tracked generated artifacts
        run: |
          git rm -r --ignore-unmatch .turbo node_modules apps/api/.turbo apps/api/node_modules apps/api/generated packages/db/src/generated
      - name: Normalize schema and documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          schema = Path('packages/db/prisma/schema.prisma')
          text = schema.read_text()
          old = '''  organization   Organization? @relation(fields: [organizationId], references: [id])\n  organizationId String?\n'''
          if old not in text:
              raise SystemExit('Expected ChannelMember duplicate organization relation was not found')
          schema.write_text(text.replace(old, ''))

          registry = Path('packages/contracts/src/public-api.ts')
          text = registry.read_text()
          old = '''\t\tsecurity: "either",\n\t},\n\t{\n\t\tmethod: "GET",\n\t\tpath: "/v1/platform/api-keys",'''
          new = '''\t\tsecurity: "none",\n\t},\n\t{\n\t\tmethod: "GET",\n\t\tpath: "/v1/platform/api-keys",'''
          if old not in text:
              raise SystemExit('Expected platform health security declaration was not found')
          registry.write_text(text.replace(old, new, 1))

          server = Path('apps/api/src/server.ts')
          text = server.read_text()
          text = text.replace('registerCommunicationRoutesV2', 'registerCommunicationRoutes')
          text = text.replace('registerDocsFilesRoutesV2', 'registerDocsFilesRoutes')
          server.write_text(text)

          claude = Path('CLAUDE.md')
          text = claude.read_text().replace(
              'e deve ser incorporada ao índice normativo de decisões na próxima manutenção documental.',
              'e está indexada por esta decisão normativa.'
          )
          claude.write_text(text)

          decisions = Path('docs/DECISIONS.md')
          text = decisions.read_text()
          if '## ADR-0010: REST + OpenAPI como contrato externo canónico da V1' not in text:
              text += '''\n\n## ADR-0010: REST + OpenAPI como contrato externo canónico da V1\n\n- Estado: aceite para a V1\n- Data: 2026-09-17\n\n### Contexto\n\nO manual histórico declarava simultaneamente tRPC 11 e Fastify + OpenAPI 3.1, enquanto a implementação real da V1 usa REST sobre Fastify e o repositório não contém servidor tRPC. Manter duas stacks como contratos públicos criaria duas fontes de verdade.\n\n### Decisão\n\n1. REST sobre Fastify é o contrato externo canónico da OryonOS V1.\n2. OpenAPI 3.1 é a representação pública máquina-legível desse contrato.\n3. Schemas Zod em `packages/contracts` são a fonte de verdade executável para entradas e saídas públicas.\n4. `packages/contracts/src/public-api.ts` reúne a fronteira HTTP pública e referencia os schemas por capacidade.\n5. `apps/api/src/openapi.ts` gera o documento OpenAPI a partir desse catálogo, sem definições de payload duplicadas.\n6. O SDK oficial pertence ao workspace pnpm e consome os mesmos contracts para tipos e validação de runtime.\n7. tRPC não faz parte da V1. Uma futura introdução de tRPC exige novo ADR e não pode criar um segundo contrato público para os mesmos recursos.\n\n### Consequência\n\nA cadeia canónica passa a ser `Zod Contract → API validation → OpenAPI 3.1 → SDK → UI data access`.\n'''
              decisions.write_text(text)
          PY
      - name: Add ChannelMember canonicalization migration
        run: |
          mkdir -p packages/db/prisma/migrations/20260917120000_channel_member_org_canonicalization
          cat > packages/db/prisma/migrations/20260917120000_channel_member_org_canonicalization/migration.sql <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'channel_members'
                AND column_name = 'organization_id'
            ) THEN
              IF EXISTS (
                SELECT 1 FROM channel_members
                WHERE organization_id IS NOT NULL
                  AND organization_id <> org_id
              ) THEN
                RAISE EXCEPTION 'channel_members.organization_id conflicts with canonical org_id';
              END IF;
              ALTER TABLE "channel_members" DROP COLUMN "organization_id";
            END IF;
          END $$;
          SQL
      - name: Install and refresh lockfile
        run: pnpm install
      - run: pnpm db:generate
      - run: pnpm db:validate
      - run: pnpm check:boundaries
      - run: pnpm check:contracts
      - run: pnpm check:v1
      - run: pnpm check:phase13
      - run: pnpm check:phase14
      - run: pnpm check:phase15
      - run: pnpm gen:openapi
      - run: pnpm gen:sdk
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --passWithNoTests
      - run: pnpm build
      - run: git diff --check
      - name: Commit normalized branch
        run: |
          git add -A
          git rm --cached --ignore-unmatch .github/workflows/phase1-normalize.yml || true
          git commit -m "chore: complete phase 1 repository normalization"
          git push origin HEAD:exec/phase1-canonical-build-integrity
