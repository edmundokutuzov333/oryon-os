name: phase15-final-type-fix
on:
  push:
    branches: [feat/phase-15-platform-release]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[phase15-final-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Normalize PageKind for Prisma
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('packages/db/src/repositories/docs-files.repository.ts')
          text = p.read_text()
          old = 'const page = await tx.page.create({ data: { orgId, workspaceId: input.workspaceId ?? null, parentPageId: input.parentPageId ?? null, title: input.title, kind: input.kind === "CANVAS" || input.kind === "DATABASE_VIEW" ? "DOC" : input.kind ?? "DOC", ownerId: input.ownerId ?? actorId, classification: input.classification ?? null, position, contentJson: { type: "doc", content: [{ type: "paragraph" }] }, contentText: "", indexable: false, createdBy: actorId } });'
          new = 'const pageKind = input.kind === "WIKI" ? "WIKI" : input.kind === "NOTE" ? "NOTE" : "DOC";\n      const page = await tx.page.create({ data: { orgId, workspaceId: input.workspaceId ?? null, parentPageId: input.parentPageId ?? null, title: input.title, kind: pageKind, ownerId: input.ownerId ?? actorId, classification: input.classification ?? null, position, contentJson: { type: "doc", content: [{ type: "paragraph" }] }, contentText: "", indexable: false, createdBy: actorId } });'
          if text.count(old) != 1: raise SystemExit(f'expected one page create expression, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
          rm .github/workflows/phase15-final-type-fix.yml
          rm scripts/.phase15-trigger 2>/dev/null || true
          git config user.name "oryon-ci"
          git config user.email "ci@oryon.local"
          git add packages/db/src/repositories/docs-files.repository.ts .github/workflows/phase15-final-type-fix.yml scripts/.phase15-trigger
          git commit -m "fix(db): normalize page kind for Prisma [phase15-final-fix]"
          git push origin HEAD:feat/phase-15-platform-release
