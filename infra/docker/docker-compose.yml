name: oryonos-local

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: oryon-postgres:17-pgvector0.8.6-partman5.4.3
    container_name: oryon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oryon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oryon_local}
      POSTGRES_DB: ${POSTGRES_DB:-oryon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - oryon_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oryon} -d ${POSTGRES_DB:-oryon}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [oryon]

  redis:
    image: ${ORYON_REDIS_IMAGE:-redis:7.4-alpine}
    container_name: oryon-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - oryon_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [oryon]

  nats:
    image: ${ORYON_NATS_IMAGE:-nats:2.11-alpine}
    container_name: oryon-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - oryon_nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [oryon]

  typesense:
    image: ${ORYON_TYPESENSE_IMAGE:-typesense/typesense:28.0}
    container_name: oryon-typesense
    restart: unless-stopped
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-oryon-typesense-local}
      TYPESENSE_ENABLE_CORS: ${TYPESENSE_ENABLE_CORS:-true}
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:-oryon-typesense-local}", "--enable-cors"]
    ports:
      - "${TYPESENSE_PORT:-8108}:8108"
    volumes:
      - oryon_typesense_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8108/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [oryon]

  minio:
    image: ${ORYON_MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z}
    container_name: oryon-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-oryon}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-oryon_local_password}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - oryon_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [oryon]

  minio-init:
    image: ${ORYON_MINIO_CLIENT_IMAGE:-minio/mc:RELEASE.2025-04-08T15-39-49Z}
    container_name: oryon-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/${S3_BUCKET:-oryon-local} &&
      mc anonymous set none local/${S3_BUCKET:-oryon-local}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-oryon}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-oryon_local_password}
    restart: "no"
    networks: [oryon]

  livekit:
    image: ${ORYON_LIVEKIT_IMAGE:-livekit/livekit-server:v1.9.0}
    container_name: oryon-livekit
    restart: unless-stopped
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "${LIVEKIT_SIGNAL_PORT:-7880}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_RTC_PORT:-7882}:7882/udp"
      - "${LIVEKIT_RTC_PORT_RANGE_START:-50000}-${LIVEKIT_RTC_PORT_RANGE_END:-50100}:${LIVEKIT_RTC_PORT_RANGE_START:-50000}-${LIVEKIT_RTC_PORT_RANGE_END:-50100}/udp"
    networks: [oryon]

networks:
  oryon:
    name: oryon-local
    driver: bridge

volumes:
  oryon_postgres_data:
    name: oryon_postgres_data
  oryon_redis_data:
    name: oryon_redis_data
  oryon_nats_data:
    name: oryon_nats_data
  oryon_typesense_data:
    name: oryon_typesense_data
  oryon_minio_data:
    name: oryon_minio_data
